<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="sky" cx="64" cy="58" r="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a2a5e"/>
      <stop offset="1" stop-color="#140f24"/>
    </radialGradient>
    <linearGradient id="rainbow" x1="0" y1="14" x2="0" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff3b4e"/>
      <stop offset=".2" stop-color="#ff8a1f"/>
      <stop offset=".38" stop-color="#ffe03a"/>
      <stop offset=".58" stop-color="#3fdc7c"/>
      <stop offset=".78" stop-color="#3a9bff"/>
      <stop offset="1" stop-color="#9a55ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="tile">
      <rect width="124" height="124" x="2" y="2" rx="22"/>
    </clipPath>
    <g id="cloud">
      <!-- Cap -->
      <circle cx="64" cy="33" r="21"/>
      <circle cx="46" cy="38" r="16"/>
      <circle cx="82" cy="38" r="16"/>
      <circle cx="33" cy="50" r="11"/>
      <circle cx="95" cy="50" r="11"/>
      <ellipse cx="64" cy="52" rx="38" ry="10"/>
      <!-- Stem -->
      <path d="M53 56C56 70 52 86 44 100h40c-8-14-12-30-9-44z"/>
      <!-- Collar -->
      <ellipse cx="64" cy="72" rx="17" ry="5"/>
      <!-- Base -->
      <circle cx="38" cy="106" r="12"/>
      <circle cx="56" cy="100" r="13"/>
      <circle cx="73" cy="100" r="13"/>
      <circle cx="91" cy="106" r="12"/>
      <ellipse cx="64" cy="112" rx="50" ry="9"/>
    </g>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="128" height="128" fill="url(#sky)"/>
    <use href="#cloud" fill="url(#rainbow)" filter="url(#glow)" opacity=".7"/>
    <use href="#cloud" fill="url(#rainbow)"/>
    <!-- Cap highlights and the shadow under it -->
    <g fill="#fff" opacity=".28">
      <circle cx="58" cy="27" r="9"/>
      <circle cx="41" cy="35" r="6"/>
    </g>
    <ellipse cx="64" cy="58" rx="30" ry="4" fill="#140f24" opacity=".25"/>
  </g>
</svg>
